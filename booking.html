
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Ticket Booking</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f3f6;
            padding: 30px 15px;
        }

        .container {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0002;
        }

        h1 {
            text-align: center;
            color: #142850;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus, select:focus {
            outline: 2px solid #007bff;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .radio-group label {
            font-weight: normal;
            margin: 0;
        }

        .radio-group input {
            width: auto;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            color: white;
        }

        .submit {
            background: #007bff;
        }

        .reset {
            background: #dc3545;
        }

        button:hover {
            opacity: 0.85;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #007bff;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>IPL Ticket Booking</h1>
    <p>Book your favourite IPL match tickets!</p>

    <form action="#" method="get">

        <label for="name">Full Name</label>
        <input type="text" id="name" name="name"
               placeholder="Enter your name"
               minlength="3" maxlength="30" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email"
               placeholder="Enter your email"
               required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone"
               placeholder="Enter 10-digit phone number"
               pattern="[0-9]{10}"
               maxlength="10" required>

        <label for="match">Select Match</label>
        <select id="match" name="match" required>
            <option value="">-- Select a Match --</option>
            <option value="RCB vs CSK">RCB vs CSK</option>
            <option value="MI vs KKR">MI vs KKR</option>
            <option value="SRH vs RR">SRH vs RR</option>
            <option value="DC vs PBKS">DC vs PBKS</option>
        </select>

        <label for="stand">Stand Category</label>
        <select id="stand" name="stand" required>
            <option value="">-- Select Stand --</option>
            <option value="General">General Stand</option>
            <option value="Premium">Premium Stand</option>
            <option value="VIP">VIP Stand</option>
        </select>

        <label for="tickets">Number of Tickets</label>
        <input type="number" id="tickets" name="tickets"
               min="1" max="10"
               placeholder="Enter number of tickets"
               required>

        <label>Additional Preference</label>
        <div class="radio-group">
            <label>
                <input type="radio" name="preference"
                       value="Family"> Family
            </label>

            <label>
                <input type="radio" name="preference"
                       value="Friends"> Friends
            </label>
        </div>

        <div class="buttons">
            <button type="submit" class="submit">
                Submit Booking
            </button>

            <button type="reset" class="reset">
                Reset
            </button>
        </div>

    </form>

    <a href="index.html" class="back">Back to Home</a>

</div>

</body>
</html>
